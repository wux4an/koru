name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: No external processes in the build
        run: |
          # AGENTS.md: os/exec only in tests/external (build tag android_external).
          if git grep -n '"os/exec"' -- '*.go' ':!tests/external/**'; then exit 1; fi

  platforms:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and run
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/koru
          ./bin/koru version
          ./bin/koru create smoke-app --template basic --name Smoke --app-id com.example.smoke < /dev/null
          ./bin/koru build smoke-app --output smoke.apk
          ./bin/koru verify smoke.apk
      - name: Unit tests
        if: matrix.os == 'macos-latest'
        run: go test ./...

  javascript:
    name: JavaScript module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test packages/javascript/core.test.cjs

  release-dry-run:
    name: Release archives and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint shell scripts
        run: shellcheck scripts/release.sh scripts/install.sh scripts/test-install.sh
      - name: Build every release archive
        run: |
          version=$(sed -n 's/^\tversion = "\(.*\)"$/\1/p' cmd/koru/main.go)
          scripts/release.sh "v$version" release
      - name: Test the installer against them
        run: scripts/test-install.sh release
