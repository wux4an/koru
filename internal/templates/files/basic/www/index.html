<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>__APP_NAME__</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="badge" id="platform">Starting…</p>
        <h1>__APP_NAME__</h1>
        <p class="lead">Edit <code>www/index.html</code> and save. <code>koru dev</code> reloads this page for you.</p>
      </header>

      <section class="card" aria-labelledby="counter-title">
        <h2 id="counter-title">Saved counter</h2>
        <p>The value is kept with <code>storage</code>, so it survives restarts.</p>
        <button id="count" type="button">Count: 0</button>
      </section>

      <section class="card" aria-labelledby="device-title">
        <h2 id="device-title">This device</h2>
        <dl id="device"><dt>Model</dt><dd>…</dd></dl>
      </section>

      <section class="card" aria-labelledby="actions-title">
        <h2 id="actions-title">Native actions</h2>
        <div class="row">
          <button id="vibrate" type="button">Vibrate</button>
          <button id="share" type="button">Share</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
