name: Release

# Push a tag like v0.0.1 to publish a release, or run it by hand with a tag:
# if the tag does not exist yet it is created on the chosen branch once the
# checks pass. The tag must match the version in cmd/koru/main.go; see
# docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish or rebuild, such as v0.0.1 (created on the chosen branch if missing)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # One Linux machine builds every platform: Go cross-compiles them.
    name: Test, build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the tag, or prepare it
        id: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "'$TAG' is not a tag like v0.0.1"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          else
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "Tag $TAG not found"; exit 1; }
            echo "Tag $TAG will be created on $GITHUB_REF_NAME ($GITHUB_SHA) after the checks pass"
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release never reuses a build cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches cmd/koru/main.go
        run: |
          version=$(sed -n 's/^\tversion = "\(.*\)"$/\1/p' cmd/koru/main.go)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG but cmd/koru/main.go declares $version"; exit 1; }
      - name: Tests, archives and installer test
        env:
          RELEASE_DIR: release
          SELFTEST_APK: selftest/selftest.apk
          SELFTEST_SIGNING_KEY: ${{ secrets.SELFTEST_SIGNING_KEY }}
        run: scripts/ci.sh
      - name: Create the tag
        if: steps.tag.outputs.create == 'true'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" -m "koru $TAG"
          git push origin "refs/tags/$TAG"
      - name: Add the installers and the self-test APK
        run: |
          cp scripts/install.sh scripts/install.ps1 selftest/selftest.apk release/
          cd release
          sha256sum selftest.apk > selftest.apk.sha256
          cat selftest.apk.sha256 >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/selftest.apk
            release/SHA256SUMS
      - name: Release notes
        env:
          SELFTEST_SIGNING_KEY: ${{ secrets.SELFTEST_SIGNING_KEY }}
        run: |
          version="${TAG#v}"
          # The CHANGELOG section for this version, up to the next "## ".
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          curl -fsSL https://koru.js.org/install.sh | sh
          \`\`\`

          On Windows (PowerShell): \`irm https://koru.js.org/install.ps1 | iex\`

          ## Verify a download

          \`\`\`sh
          sha256sum -c koru_${version}_linux_amd64.tar.gz.sha256
          gh attestation verify koru_${version}_linux_amd64.tar.gz --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## Self-test app

          \`selftest.apk\` is [examples/selftest](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}/examples/selftest) built with this release: install it on a phone or emulator and it runs every automatic check of the bridge, the plugins and the WebView when it opens. It is a debug build, so the WebView can be inspected with DevTools. Send the "Copy report" JSON with any failure.
          NOTES
          if [ -z "$SELFTEST_SIGNING_KEY" ]; then
            printf '\nEach release signs selftest.apk with a new key: uninstall the previous self-test app before installing this one.\n' >> notes.md
          fi
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only tags like v1.0.0-rc.1 are prereleases: /releases/latest, which
          # the installers and the website read, skips prereleases.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release/* --title "koru $TAG" --notes-file notes.md --verify-tag $prerelease
          fi

      - name: Install the published release
        run: |
          KORU_VERSION="$TAG" sh scripts/install.sh --dir "$RUNNER_TEMP/koru"
          "$RUNNER_TEMP/koru/koru" version | grep -F "koru ${TAG#v}"
      - name: Update the Homebrew formula and the Scoop manifest on main
        # This repository is also the Homebrew tap and the Scoop bucket.
        if: ${{ !contains(env.TAG, '-') }}
        run: |
          git fetch -q origin main
          git checkout -q -B main origin/main
          scripts/package-managers.sh "$TAG" release/SHA256SUMS
          git add Formula/koru.rb bucket/koru.json
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "release: Homebrew y Scoop para koru $TAG"
          git push origin main
      - name: Install with Homebrew
        if: ${{ !contains(env.TAG, '-') }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap wux4an/koru "https://github.com/$GITHUB_REPOSITORY"
          brew install wux4an/koru/koru
          koru version | grep -F "koru ${TAG#v}"
          brew test wux4an/koru/koru
